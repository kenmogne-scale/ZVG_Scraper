<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZVG Favoriten</title>
    <style>
      /* Minimal fallback — design.css has full styles */
    </style>
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body>
    <div class="wrap">
      <nav class="nav-links app-sidebar" aria-label="Hauptnavigation">
        <a class="nav-link" href="/">Datenbank</a>
        <a class="nav-link" href="/pipeline">Pipeline</a>
        <a class="nav-link is-active" href="/favorites">Favoriten</a>
      </nav>
      <main class="shell">
        <section class="topbar">
          <article class="topbar-card">
            <span class="metric-label">Favoriten</span>
            <strong class="metric-value" id="metric-total">0</strong>
          </article>
          <article class="topbar-card">
            <span class="metric-label">Gesamtwert</span>
            <strong class="metric-value" id="metric-value">-</strong>
          </article>
          <article class="topbar-card">
            <span class="metric-label">Gebote</span>
            <strong class="metric-value" id="metric-bids">-</strong>
          </article>
        </section>

        <section class="panel results">
          <div class="results-head">
            <div>
              <h2>Favoriten</h2>
              <p>Deals, die du in der Pipeline als Favorit markiert hast.</p>
            </div>
            <span class="result-badge" id="result-count">0 Objekte</span>
          </div>

          <div class="filters">
            <div class="control">
              <label for="search">Suche</label>
              <input id="search" type="search" placeholder="Ort, Strasse, Aktenzeichen ..." />
            </div>
            <div class="control">
              <label for="stage-filter">Status</label>
              <select id="stage-filter">
                <option value="">Alle Status</option>
                <option value="shortlist">Shortlist</option>
                <option value="in_pruefung">In Pruefung</option>
                <option value="gebot_geplant">Gebot geplant</option>
                <option value="verworfen">Verworfen</option>
              </select>
            </div>
            <div class="control">
              <label for="priority-filter">Prioritaet</label>
              <select id="priority-filter">
                <option value="">Alle</option>
                <option value="high">Hoch</option>
                <option value="medium">Mittel</option>
                <option value="low">Niedrig</option>
              </select>
            </div>
          </div>

          <div class="table-toolbar">
            <div>
              <div class="table-toolbar-label">Ansicht</div>
              <div class="table-toolbar-copy" id="table-context">Favorisierte Pipeline-Deals.</div>
            </div>
          </div>

          <div class="table-shell">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Favorit</th>
                    <th>Bundesland</th>
                    <th>Strasse</th>
                    <th>Ort</th>
                    <th>Objektart</th>
                    <th>Wert</th>
                    <th>Gesamtflaeche</th>
                    <th>Preis / qm</th>
                    <th>Termin</th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
          </div>
          <div class="pager-bar">
            <span class="table-toolbar-copy" id="pagination-info">Seite 1 / 1</span>
            <div class="pager-actions">
              <button class="table-toggle" id="prev-page" type="button">Zurueck</button>
              <button class="table-toggle" id="next-page" type="button">Naechste Seite</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal" id="detail-modal" hidden>
      <div class="modal-backdrop" id="detail-backdrop"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button class="modal-close" id="detail-close" type="button" aria-label="Schliessen">&times;</button>
        <div class="modal-content" id="detail-content"></div>
      </div>
    </div>
    <script type="module" src="/portfolio.js"></script>
  </body>
</html>
